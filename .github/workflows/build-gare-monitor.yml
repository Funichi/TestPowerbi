name: Build Gare Monitor (exe Windows)
on:
  workflow_dispatch:
  push:
    paths: ["gare-monitor/**", ".github/workflows/build-gare-monitor.yml"]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gare-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      # il bootloader precompilato di PyInstaller è noto a Defender (falsi positivi): lo compiliamo noi dal sorgente
      - shell: bash
        run: pip install --no-binary pyinstaller pyinstaller || pip install pyinstaller
      - run: python -m pytest -q tests
      # cartella (non --onefile): gli exe "autoestraenti" sono molto più spesso scambiati per virus
      - run: pyinstaller --onedir --noupx --name GareOfferte --add-data "static;static" --hidden-import win32timezone --hidden-import pythoncom --hidden-import win32com.client app.py
      - run: copy Avvio-automatico.bat, Disattiva-avvio-automatico.bat dist\GareOfferte\
      - uses: actions/upload-artifact@v4
        with:
          name: GareOfferte-windows
          path: gare-monitor/dist/GareOfferte/
